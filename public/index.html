<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desk Dashboard</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0e1116; --panel:#171b22; --card:#1d222b; --text:#e6e9ef; --dim:#8a93a3;
          --working:#4c9aff; --ask:#ffb020; --done:#3ecf8e; --idle:#5b6472; --bad:#ff6b6b; }
  * { box-sizing:border-box; scrollbar-width:thin; scrollbar-color:#3a4252 transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

  /* ---- compact top band ---- */
  header { display:flex; align-items:center; gap:28px; padding:12px 28px 6px; }
  #clock { font-size:44px; font-weight:200; letter-spacing:1px; line-height:1; }
  #date { color:var(--dim); font-size:15px; margin-top:2px; }
  #away { flex:1; font-size:16px; color:var(--dim); min-width:0; }
  #away b { color:var(--text); }
  #chips { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .chip { display:flex; align-items:center; gap:6px; background:var(--panel); border-radius:20px; padding:5px 12px; font-size:15px; white-space:nowrap; }
  .chip i { width:9px; height:9px; border-radius:50%; background:var(--idle); }
  .chip.ask { color:var(--ask); box-shadow:0 0 0 1px var(--ask) inset; } .chip.ask i { background:var(--ask); }
  .chip.run i { background:var(--working); } .chip.dn i { background:var(--done); }
  #tabsrow { display:flex; align-items:center; gap:8px; padding:2px 28px 8px; overflow:hidden; white-space:nowrap; }
  #tabsrow h2 { margin:0 6px 0 0; }
  .tab { display:flex; align-items:center; gap:6px; background:var(--panel); border-radius:6px; padding:3px 10px; font-size:13px; border:1px solid transparent; flex:none; max-width:300px; }
  .tab span.n { overflow:hidden; text-overflow:ellipsis; padding:0; border:0; }
  .tab.sel { border-color:#3a4252; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--idle); flex:none; }
  .tab.working .dot { background:var(--working); animation:blink 1s infinite; }
  .tab.waiting .dot { background:var(--ask); animation:blink 1s infinite; }
  .tab.idle .dot { background:var(--done); }
  .tab.shell { color:var(--dim); }
  @keyframes blink { 50% { opacity:.3; } }

  main { flex:1; display:grid; grid-template-columns:2fr 1fr; gap:16px; padding:4px 28px 20px; min-height:0; }
  section { background:var(--panel); border-radius:14px; padding:16px 20px; overflow:hidden; min-height:0; }
  h2 { margin:0 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:2px; color:var(--dim); font-weight:600; }

  /* ---- session cards ---- */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; align-content:start; }
  .card { border-left:6px solid var(--idle); background:var(--card); border-radius:10px; padding:10px 14px; min-width:0; }
  .card.working { border-color:var(--working); }
  .card.background { border-color:var(--working); animation:pulseb 2.4s infinite; }
  .card.asking, .card.perm { border-color:var(--ask); box-shadow:0 0 0 1px var(--ask) inset; animation:pulse 2s infinite; }
  .card.done { border-color:var(--done); }
  @keyframes pulse { 50% { background:#2a2417; } }
  @keyframes pulseb { 50% { background:#18263a; } }
  .proj { font-size:17px; font-weight:600; line-height:1.25; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .proj > span:first-child { min-width:0; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .tag { font-size:11px; text-transform:uppercase; letter-spacing:1px; padding:2px 8px; border-radius:20px; flex:none; background:#2b313c; }
  .working .tag, .background .tag { color:var(--working); } .asking .tag, .perm .tag { color:var(--ask); background:#3a2e12; } .done .tag { color:var(--done); }
  .agent { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; margin-left:8px; font-weight:400; }
  .new-tag { font-size:10px; letter-spacing:1px; text-transform:uppercase; background:var(--working); color:#08111f; border-radius:20px; padding:1px 7px; margin-left:8px; vertical-align:middle; }
  .dir { color:var(--dim); font-size:12px; margin-top:1px; }
  .msg { margin-top:6px; font-size:14px; color:#c3c9d4; border-left:2px solid #2f3643; padding-left:8px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; }
  .msg.q { border-color:var(--ask); color:#ffe2a6; }
  .fact { margin-top:6px; font-size:13px; color:var(--dim); }
  .fact.warn { color:var(--ask); font-weight:600; }
  .fact.ok { color:var(--working); font-weight:600; }
  .log { margin-top:6px; font-size:12px; color:var(--dim); }
  .log div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .log .chg { color:var(--text); }
  .age { color:var(--dim); font-size:12px; margin-top:4px; }
  .card.isnew { background:#222a38; }

  /* ---- right column ---- */
  .side { display:flex; flex-direction:column; gap:16px; min-height:0; }
  .side section:first-child { flex:0 0 auto; max-height:40%; }
  .side section:last-child { flex:1; -webkit-mask-image:linear-gradient(to bottom,#000 88%,transparent); mask-image:linear-gradient(to bottom,#000 88%,transparent); }
  ul { list-style:none; margin:0; padding:0; }
  li { padding:5px 0; display:flex; gap:10px; }
  li.done { color:var(--dim); text-decoration:line-through; }
  .box { width:16px; height:16px; border:2px solid var(--dim); border-radius:4px; flex:none; margin-top:3px; }
  li.done .box { background:var(--done); border-color:var(--done); }
  .h { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:1px; margin-top:12px; }
  .n { padding:8px 0; border-bottom:1px solid #232933; }
  .n .a { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:1px; display:flex; justify-content:space-between; }
  .n .t { font-weight:600; } .n .b { color:var(--dim); font-size:14px; }
  .n.isnew { border-left:3px solid var(--working); padding-left:10px; }
  .empty { color:var(--dim); }
  #tabs { display:flex; gap:8px; }

  /* ---- two-screen mode (?view=main on the primary screen, ?view=side on the second) ---- */
  body.view-main #tabsrow, body.view-main .side { display:none; }
  body.view-main main { grid-template-columns:1fr; }
  body.view-side #away, body.view-side #chips, body.view-side #tabsrow, body.view-side #sessec { display:none; }
  body.view-side main { grid-template-columns:1fr 1.6fr; grid-template-rows:auto 1fr; }
  body.view-side .side { display:contents; }
  body.view-side #tabsec { display:block; grid-column:1; grid-row:1; max-height:55vh; }
  body.view-side #todosec { grid-column:1; grid-row:2; max-height:none; }
  body.view-side #notsec { grid-column:2; grid-row:1 / 3; }
  #tabsec { display:none; }
  #tabsec #tabs { flex-direction:column; }
  #tabsec .tab { max-width:none; font-size:15px; padding:6px 12px; background:var(--card); }
</style>
</head>
<body>
<header>
  <div><div id="clock"></div><div id="date"></div></div>
  <div id="away"></div>
  <div id="chips"></div>
</header>
<div id="tabsrow"><h2>Tabs</h2><div id="tabs"></div></div>
<main>
  <section id="sessec"><h2>Agent sessions</h2><div id="sessions" class="grid"></div></section>
  <section id="tabsec"><h2>Tabs</h2></section>
  <div class="side">
    <section id="todosec"><h2>Today</h2><div id="todos"></div></section>
    <section id="notsec"><h2>Notifications</h2><div id="notifs"></div></section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const params = new URLSearchParams(location.search);
const SINCE = +params.get('since') || 0; // set by the screensaver host
const VIEW = params.get('view') || ''; // 'main' / 'side' when the screensaver spans two screens
if (VIEW) document.body.classList.add('view-' + VIEW);
if (VIEW === 'side') $('tabsec').appendChild($('tabs'));
let state = { sessions: [], todos: { items: [] }, notifications: [], tabs: [], ui: {} };
const loc = () => (state.ui && state.ui.dateLocale) || undefined; // undefined = system locale

const ago = ms => { const s = Math.max(0, Math.round((Date.now() - ms) / 1000)); return s < 60 ? s + 's ago' : s < 3600 ? Math.round(s / 60) + 'm ago' : Math.round(s / 3600) + 'h ago'; };
const dur = ms => ms < 60000 ? Math.max(1, Math.round(ms / 1000)) + 's' : Math.round(ms / 60000) + 'm';
const hm = ms => new Date(ms).toLocaleTimeString(loc(), { hour: '2-digit', minute: '2-digit' });
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const isNew = t => SINCE && t > SINCE;

// Effective state: combines the hook/DB status with what the terminal tab shows.
function eff(s) {
  const tab = state.tabs.find(t => s.title && t.name === s.title);
  const spinning = tab && tab.status === 'working';
  if (s.status === 'waiting') return s.asking ? { key: 'asking', label: 'asking you' } : { key: 'perm', label: 'needs permission' };
  if (s.status !== 'working' && s.asking) return { key: 'asking', label: 'asking you' };
  if (s.status !== 'working' && spinning) return { key: 'background', label: 'still running' };
  return { key: s.status, label: s.status };
}
const rank = { asking: 0, perm: 0, background: 1, working: 2, done: 3, idle: 4 };

function facts(s, e) {
  if (s.turn && e.key === 'working') return `<div class="fact">running ${dur(Date.now() - s.turn.start)} · ${plural(s.turn.tools, 'tool')} so far</div>`;
  const lt = s.lastTurn; if (!lt) return '';
  const base = `${dur(lt.ms)} · ${plural(lt.tools, 'tool')}`;
  if (lt.ms < 30000 && e.key === 'background') return `<div class="fact ok">⚡ short turn (${base}) — long job is running in its tab ✓</div>`;
  if (lt.ms < 30000 && e.key === 'done') return lt.tools === 0
    ? `<div class="fact warn">⚡ short turn (${dur(lt.ms)}, no tools) — nothing was started</div>`
    : `<div class="fact warn">⚡ short turn (${base}) — nothing running now, check the job started</div>`;
  return `<div class="fact">last turn ${base} · ended ${hm(lt.end)}</div>`;
}

function timeline(s) {
  const log = (s.log || []).slice(-8);
  const shown = (SINCE ? log.filter(l => l.t > SINCE) : []).slice(-4);
  const rows = (shown.length ? shown : log.slice(-3));
  return rows.length ? `<div class="log">${rows.map(l => `<div class="${isNew(l.t) ? 'chg' : ''}">${hm(l.t)} ${esc(l.txt)}</div>`).join('')}</div>` : '';
}

function card(s) {
  const e = eff(s);
  const tail = (s.lastMessage || '').trim();
  const snippet = tail.length > 240 ? '…' + tail.slice(-240) : tail;
  return `<div class="card ${e.key}${isNew(s.updated) ? ' isnew' : ''}">
    <div class="proj"><span>${esc(s.title || s.project || s.id.slice(0, 8))}${s.agent && s.agent !== 'claude' ? `<span class="agent">${esc(s.agent)}</span>` : ''}${isNew(s.updated) ? '<span class="new-tag">new</span>' : ''}</span><span class="tag">${e.label}</span></div>
    ${s.title && s.project ? `<div class="dir">${esc(s.project)}</div>` : ''}
    ${snippet ? `<div class="msg ${e.key === 'asking' ? 'q' : ''}">${esc(snippet)}</div>` : (s.detail || s.prompt ? `<div class="msg">${esc(s.detail || s.prompt)}</div>` : '')}
    ${facts(s, e)}${timeline(s)}
    <div class="age">${ago(s.updated)}</div>
  </div>`;
}

function render() {
  const { todos } = state;
  const sessions = [...state.sessions].sort((a, b) => (rank[eff(a).key] ?? 5) - (rank[eff(b).key] ?? 5) || b.updated - a.updated);
  const keys = sessions.map(s => eff(s).key);
  const nAsk = keys.filter(k => k === 'asking' || k === 'perm').length;
  const nRun = keys.filter(k => k === 'working' || k === 'background').length;
  const nDone = keys.filter(k => k === 'done').length;
  const open = todos.items.filter(t => !t.done).length;
  const nn = state.notifications.reduce((a, n) => a + n.count, 0);

  $('chips').innerHTML =
    `<div class="chip ${nAsk ? 'ask' : ''}"><i></i>${nAsk ? plural(nAsk, 'session') + ' need you' : 'nothing waiting on you'}</div>` +
    `<div class="chip run"><i></i>${nRun} running</div><div class="chip dn"><i></i>${nDone} done</div>` +
    `<div class="chip">${plural(open, 'todo')}</div><div class="chip">${plural(nn, 'notification')}</div>`;

  if (SINCE) {
    const changed = sessions.filter(s => isNew(s.updated));
    const bits = [];
    const asks = changed.filter(s => ['asking', 'perm'].includes(eff(s).key)).length;
    const fin = changed.filter(s => eff(s).key === 'done').length;
    const bg = changed.filter(s => eff(s).key === 'background').length;
    if (asks) bits.push(`<b>${asks}</b> waiting for you`);
    if (bg) bits.push(`<b>${bg}</b> still running`);
    if (fin) bits.push(`<b>${fin}</b> finished`);
    const newN = state.notifications.filter(n => isNew(n.time)).reduce((a, n) => a + n.count, 0);
    if (newN) bits.push(`<b>${newN}</b> new notification${newN > 1 ? 's' : ''}`);
    const mins = Math.max(1, Math.round((Date.now() - SINCE) / 60000));
    $('away').innerHTML = `Since you left (${mins >= 60 ? Math.round(mins / 60) + 'h' : mins + ' min'}): ` + (bits.length ? bits.join(' · ') : 'nothing new');
  }

  $('tabs').innerHTML = state.tabs.length ? state.tabs.map(t => {
    const m = state.sessions.find(x => x.title && x.title === t.name);
    const st = m && m.status === 'waiting' ? 'waiting' : t.status;
    return `<div class="tab ${t.kind === 'shell' ? 'shell' : st}${t.selected ? ' sel' : ''}"><span class="dot"></span><span class="n">${esc(t.name)}</span></div>`;
  }).join('') : '<span class="empty">Windows Terminal not found.</span>';

  $('sessions').innerHTML = sessions.length ? sessions.map(card).join('') : '<div class="empty">No active sessions reported yet.</div>';

  let html = '', last = null;
  if (!todos.exists) html = '<div class="empty">No daily note for today yet.</div>';
  else if (!todos.items.length) html = '<div class="empty">No tasks in today\'s note.</div>';
  else {
    html = '<ul>';
    for (const t of todos.items) {
      if (t.heading !== last) { html += `</ul><div class="h">${esc(t.heading)}</div><ul>`; last = t.heading; }
      html += `<li class="${t.done ? 'done' : ''}" style="margin-left:${t.indent * 6}px"><span class="box"></span><span>${esc(t.text)}</span></li>`;
    }
    html += '</ul>';
  }
  $('todos').innerHTML = html;

  const groups = new Map();
  for (const n of state.notifications) {
    if (!groups.has(n.app)) groups.set(n.app, { app: n.app, items: [], total: 0, time: 0, fresh: 0 });
    const g = groups.get(n.app);
    g.items.push(n); g.total += n.count; g.time = Math.max(g.time, n.time);
    if (isNew(n.time)) g.fresh += n.count;
  }
  const gl = [...groups.values()].sort((a, b) => b.time - a.time);
  $('notifs').innerHTML = gl.length ? gl.map(g => {
    const items = g.items.slice().sort((a, b) => b.time - a.time);
    const shown = items.slice(0, VIEW === 'side' ? 5 : 2), more = g.total - shown.reduce((a, n) => a + n.count, 0);
    return `<div class="n${g.fresh ? ' isnew' : ''}"><div class="a"><span>${esc(g.app)} · ${g.total}${g.fresh ? ' · ' + g.fresh + ' new' : ''}</span><span>${ago(g.time)}</span></div>` +
      shown.map(n => `<div class="t">${esc(n.title)}${n.count > 1 ? ' ×' + n.count : ''}</div>${n.body ? `<div class="b">${esc(n.body)}</div>` : ''}`).join('') +
      (more > 0 ? `<div class="b">+${more} more</div>` : '') + '</div>';
  }).join('') : '<div class="empty">No pending notifications.</div>';
}

function tick() {
  const d = new Date();
  $('clock').textContent = d.toLocaleTimeString(loc(), { hour: '2-digit', minute: '2-digit' });
  $('date').textContent = d.toLocaleDateString(loc(), { weekday: 'long', day: 'numeric', month: 'long' });
}
tick(); setInterval(tick, 1000); setInterval(render, 15000);

const es = new EventSource('/events');
es.onmessage = e => { state = JSON.parse(e.data); render(); };
document.addEventListener('dblclick', () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
</script>
</body>
</html>
